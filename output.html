<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hallucinate — Projector</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #f1ecff; font: 15px/1.4 system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    body.idle { cursor: none; }
    .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; pointer-events: none; transition: opacity 0.4s; }
    .overlay[hidden] { display: flex; opacity: 0; }
    #waiting strong { font-size: 28px; }
    #waiting span, #hint { color: #a99fc4; }
    #identify { background: rgba(0, 0, 0, 0.55); font-size: clamp(32px, 7vw, 96px); font-weight: 700; }
    #identify small { font-size: 0.35em; font-weight: 400; color: #a99fc4; }
    #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 13px; padding: 8px 14px; border-radius: 10px; background: rgba(14, 10, 24, 0.7); transition: opacity 0.4s; pointer-events: none; }
    #hint[hidden], :fullscreen #hint { opacity: 0; }
  </style>
</head>
<body>
  <canvas id="out"></canvas>
  <div id="waiting" class="overlay"><strong>Hallucinate projector</strong><span>Waiting for the main window… open Studio (O) there to run the show.</span></div>
  <div id="identify" class="overlay" hidden></div>
  <div id="hint">Double-click or press F for fullscreen</div>
  <script type="module" src="/src/output.ts"></script>
</body>
</html>
